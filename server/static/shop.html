<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>길동무 가게 화면 (시험용)</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --ink:#0b1b33; --muted:#4a5a72; --accent:#0092be; --line:#dce1e8; --ok:#0e9f5c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0a0f18; --card:#111722; --ink:#e6ecf5; --muted:#a9b7cc; --accent:#35c4f3; --line:#222c3c; --ok:#2bd17e; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif; font-size:17px; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin:12px 0; }
  select, input, button { font:inherit; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  select { width:100%; }
  button { background:var(--accent); color:#fff; border:0; font-weight:700; cursor:pointer; }
  .order { display:flex; justify-content:space-between; gap:12px; align-items:center; }
  .order b { font-size:20px; }
  .cook { color:var(--ok); font-weight:700; }
  .state { font-weight:700; padding:3px 10px; border-radius:999px; background:var(--line); }
  .s-placed { background:#fff3d6; color:#8a5a00; } .s-accepted, .s-cooking { background:#dff1fb; color:#0b5f85; } .s-ready, .s-picked_up { background:#dff5e8; color:#0b6b3d; } .s-cancelled { background:#f3d6d6; color:#8a1f1f; }
  .late { color:#c2410c; font-weight:700; }
  button.ghost { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .empty { color:var(--muted); text-align:center; padding:28px 0; }
  .note { color:var(--muted); font-size:14px; }
  label { display:block; margin:10px 0 4px; font-weight:600; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
</style>
</head>
<body>
<main>
  <h1>가게 화면</h1>
  <p class="sub">차에서 들어온 주문이 여기에 뜹니다. 시험용 화면이라 로그인이 없고, 결제는 모의입니다.</p>

  <div class="card">
    <label for="shop">가게</label>
    <select id="shop"></select>
    <p class="note" id="info"></p>
  </div>

  <div id="orders"></div>

  <details class="card">
    <summary><b>가게가 스스로 등록하기</b> (서버에 구조로 보내기)</summary>
    <label>가게 이름</label><input id="r_name" placeholder="예: 새벽커피 DT">
    <label>브랜드 (비우면 가게 이름)</label><input id="r_brand">
    <label>종류</label>
    <select id="r_place"><option>드라이브스루</option><option>휴게소</option><option>편의점·주유</option></select>
    <div class="row">
      <div><label>위도</label><input id="r_lat" value="37.4150"></div>
      <div><label>경도</label><input id="r_lon" value="127.0950"></div>
    </div>
    <div class="row">
      <div><label>전화번호</label><input id="r_phone" value="031-555-0200"></div>
      <div><label>준비 시간(분)</label><input id="r_wait" value="3"></div>
    </div>
    <label>메뉴 (한 줄에 하나: 이름, 가격, 음료|식사|간식)</label>
    <textarea id="r_menu" rows="3" style="width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)">아메리카노 1잔, 4000, 음료
샌드위치, 4500, 식사</textarea>
    <p><button id="r_go">등록하기</button> <span id="r_msg" class="note"></span></p>
  </details>
</main>
<script>
const $ = id => document.getElementById(id);
let current = null;

async function loadShops() {
  // every shop the server knows: a very large range around the sample area
  const r = await fetch('/api/shops?lat=37.41272&lon=127.09468&radius=20000');
  const d = await r.json();
  const keep = current;
  $('shop').innerHTML = d.shops.map(s => `<option value="${s.id}">${s.name} · ${s.place}</option>`).join('');
  if (keep && d.shops.some(s => s.id === keep)) $('shop').value = keep;
  current = $('shop').value || null;
  const s = d.shops.find(x => x.id === current);
  $('info').textContent = s ? `☎ ${s.phone} · 준비 ${s.wait_min}분 · 메뉴 ${s.menu.map(m => m.name + ' ' + m.price.toLocaleString() + '원').join(', ')}` : '';
}

const BTN = { accepted: '수락', cooking: '조리 시작', ready: '준비 완료', picked_up: '수령 완료', cancelled: '거절' };

async function setStatus(receipt, status) {
  await fetch('/api/shops/order/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ receipt, status }) });
  loadOrders();
}

async function loadOrders() {
  if (!current) { $('orders').innerHTML = '<div class="card empty">등록된 가게가 없어요</div>'; return; }
  const r = await fetch('/api/shops/orders?shop_id=' + encodeURIComponent(current));
  const d = await r.json();
  $('orders').innerHTML = d.items.length ? d.items.map(o => {
    const late = o.delay_min > 0 ? `<span class="late">차가 막혀서 ${o.delay_min}분 늦어요</span>` : '';
    const live = ['placed', 'accepted', 'cooking'].includes(o.status);
    const cook = !live ? '' : (o.start_cooking_now ? '<span class="cook">지금 조리를 시작하세요</span>' : `<span class="cook">${o.cook_in_min}분 뒤 조리 시작</span>`);
    const btns = o.shop_can.map(st => `<button class="${st === 'cancelled' ? 'ghost' : ''}" onclick="setStatus('${o.receipt}','${st}')">${BTN[st]}</button>`).join(' ');
    return `
    <div class="card">
      <div class="order">
        <div><b>${o.item}</b><br><span class="note">${o.receipt} · ${o.price.toLocaleString()}원 · ${o.payment}</span></div>
        <div style="text-align:right"><span class="state s-${o.status}">${o.status_label}</span><br><span class="note">${live ? '차가 ' + o.eta_min + '분 뒤 도착' : ''}</span></div>
      </div>
      <p>${cook} ${late}</p>
      <div>${btns}</div>
    </div>`;
  }).join('') : '<div class="card empty">아직 들어온 주문이 없어요</div>';
}

$('shop').addEventListener('change', () => { current = $('shop').value; loadShops(); loadOrders(); });
$('r_go').addEventListener('click', async () => {
  const menu = $('r_menu').value.split('\n').map(l => l.split(',').map(x => x.trim())).filter(p => p.length === 3 && p[0])
    .map(p => ({ name: p[0], price: parseInt(p[1], 10), kind: p[2] }));
  const body = { name: $('r_name').value, brand: $('r_brand').value || undefined, place: $('r_place').value,
    lat: parseFloat($('r_lat').value), lon: parseFloat($('r_lon').value), phone: $('r_phone').value,
    wait_min: parseInt($('r_wait').value, 10), menu };
  const r = await fetch('/api/shops/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  $('r_msg').textContent = r.ok ? '등록됐어요. 차가 5km 안에 오면 앱에 나와요.' : '등록하지 못했어요: ' + (d.error || r.status);
  if (r.ok) { current = d.id; await loadShops(); loadOrders(); }
});

loadShops().then(loadOrders);
setInterval(loadOrders, 2000);
</script>
</body>
</html>
